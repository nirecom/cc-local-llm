# LiteLLM proxy configuration for ccgw (Claude Code GateWay).
# A single native instance on the Mac serves every client; it is the only place
# the Anthropic wire format is converted, and the only TLS terminator clients
# talk to. Routes Claude Code model tiers to different backends by model name.
# Env vars are resolved at startup via os.environ/ pattern (NOT ${VAR:default}).
# All defaults are documented in .env.example, not embedded here.
#
# IMPORTANT: The os.environ/ prefix is only resolved by LiteLLM when it appears
# at the START of a value. After a provider prefix (e.g., openai/), the entire
# string including os.environ/ is passed literally to the backend. So it is used
# for connection endpoints and credentials only; litellm_params.model carries a
# hardcoded backend model name after the provider prefix.
#
# model_name is the routing key clients address, and it is written out literally
# here rather than read from each host's .env: this file is the single source of
# truth for which Claude Code tier reaches which route. The tier annotation in
# each route says which tiers it serves, scripts/code-ccgw.* reads it to build
# the child environment, and every host therefore routes from the same committed
# file. Tier vocabulary: haiku, sonnet, fable, opus, subagent -- each claimed by
# exactly one route, all five claimed somewhere. See docs/architecture.md.

model_list:
  # --- Haiku, sonnet and the subagent route: Qwen3.8-27B via llama-swap @ the Windows PC ---
  # One entry, three tiers: llama-swap's heavy group on that PC is exclusive, so a haiku
  # on its own model would evict the sonnet one on every call and reload it on the next.
  # The subagent tier shares the same key for that reason -- a route naming anything else
  # would thrash too.
  - model_name: qwen3.8-27b
    litellm_params:
      ccgw_tiers: [haiku, sonnet, subagent]
      model: openai/Qwen3.8-27B-UD-Q3_K_XL
      api_base: os.environ/LITELLM_LLAMASWAP_URL
      api_key: none
      stream: true
      max_tokens: 8192
      context_window: 102400
      # A cold 76,800-token prefill is 85s at this backend's measured 908 tok/s, so
      # the former 60s timeout expired on the first turn after every compaction.
      timeout: 600
      # drop_params discards unsupported params instead of 400ing. reasoning_effort
      # is not in the openai/ supported list for an unrecognised model name, so it
      # needs re-admitting by name -- the client's /effort must reach the backend.
      drop_params: true
      allowed_openai_params: ["reasoning_effort"]
    # Without this, LiteLLM degrades the client's xhigh/max to high before the
    # backend sees it. Qwen3.8 templates accept only xhigh/medium/low, and other
    # backends ignore the field, so passing xhigh through is right either way.
    # supports_max stays undeclared on purpose: max then degrades to xhigh, not high.
    model_info:
      supports_xhigh_reasoning_effort: true

  # --- Fable tier: DeepSeek V4 Flash via CCGW Proxy -> Mac swap layer ---
  # The Mac backends are mutually exclusive (see llama-swap/m5-max-128gb/config.yaml in this
  # repo) -- only one can be resident at once. They sit on separate Claude Code tiers
  # so /model switches between them: fable -> ds4, opus -> whichever llama-swap entry
  # the opus route below currently names.
  #
  # ds4-server accepts the Anthropic shape directly, so this route keeps the
  # anthropic/ provider and reaches the proxy at POST <origin>/v1/messages.
  - model_name: deepseek-v4-flash
    litellm_params:
      ccgw_tiers: [fable]
      model: anthropic/deepseek-v4-flash
      api_base: os.environ/LITELLM_CCGW_PROXY_URL
      api_key: os.environ/LITELLM_CCGW_PROXY_API_KEY
      stream: true
      max_tokens: 8192
      context_window: 393216
      # Inert on the anthropic/ passthrough; kept so every tier carries the line.
      allowed_openai_params: ["reasoning_effort"]
    # ds4 has a real max mode, so unlike the Qwen tiers it declares supports_max.
    model_info:
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true

  # --- Opus tier: the selected mlx_lm.server backend via CCGW Proxy -> Mac swap layer ---
  # scripts/set-model.sh rewrites the model_name and model: lines below together, so they
  # name whichever llama-swap entry is selected, not a fixed backend.
  # Both MLX backends (mlx_lm.server, mlx_vlm.server) speak only the OpenAI shape, so this
  # route uses the same openai/
  # provider pattern as haiku/sonnet: LiteLLM performs the Anthropic->OpenAI conversion
  # and reaches the backend at POST <api_base>/chat/completions. That is why api_base
  # here is the /v1 form (as LITELLM_LLAMASWAP_URL is) and not the bare origin the fable
  # tier uses: llama-swap serves /v1/chat/completions, so a bare origin yields the
  # backend's own "404 page not found" rather than any LiteLLM-level error. The body
  # model rewrite either MLX server needs is llama-swap's useModelName -- note the two want
  # opposite values there; see docs/tuning.md#mtp-speculative-decoding-qwen3827b.
  - model_name: qwen3.8-flash-next-3bit-mtp
    litellm_params:
      ccgw_tiers: [opus]
      model: openai/qwen3.8-flash-next-3bit-mtp
      api_base: os.environ/LITELLM_CCGW_PROXY_OPENAI_URL
      api_key: os.environ/LITELLM_CCGW_PROXY_API_KEY
      stream: true
      max_tokens: 8192
      context_window: 262144
      # This route had no explicit timeout, so it ran on LiteLLM's shorter default --
      # fine for a normal turn, but a long prefill on this backend (206,819 tokens
      # measured at 717s; see the MLX_VLM_TOKEN_QUEUE_TIMEOUT note on the
      # qwen3.8-flash-next-3bit-mtp entry in llama-swap/m5-max-128gb/config.yaml)
      # timed out client-side well before the backend itself gave up. Matches that
      # backend ceiling so LiteLLM never cuts the connection first.
      timeout: 3600
      # Same reason as the haiku tier above.
      drop_params: true
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      supports_xhigh_reasoning_effort: true

litellm_settings:
  # Stays false so an unsupported param is a visible 400 by default; the routes
  # that need it opt in with their own drop_params above.
  drop_params: false
  enable_caching_on_failures: false
  store_model_options_in_db: false
  # Clients reach this gateway on /v1/messages, and for an openai/ route LiteLLM
  # translates that to the Responses API (POST <api_base>/responses) by default.
  # That is the newer endpoint and not every OpenAI-compatible server implements
  # it: llama.cpp does, but mlx_lm.server (Laguna) answers a bare 404, which
  # surfaces to the client as "the model may not exist". chat/completions is the
  # endpoint all three backends implement, so route every openai/ tier there.
  # The anthropic/ fable tier is unaffected -- it takes LiteLLM's native
  # /v1/messages passthrough and never consults this flag.
  use_chat_completions_url_for_anthropic_messages: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: simple-shuffle
  # No fallback for Haiku/Sonnet tiers: the Windows PC (llama-swap) is the sole
  # backend. M4 Pro fallback was removed (2026-08) — its failure modes were not
  # worth the diagnostic overhead. A request fails outright if that PC is offline.
  num_retries: 0
  enable_pre_call_routing: false
