Devstral-Small-2-24B-Instruct-2512-IQ4_XS:
  role: general (former haiku-tier)
  used_by: []
  notes: "dense 24B, ctx 65536, KV cache Q4, heavy group, --jinja required (works around the Llama 3.1 template's role-alternation check)"
  decision: "2026-08: ctx 32768 -> 65536, light -> heavy group. Migrated the haiku/sonnet tiers from the Mac to this PC's llama-swap as part of moving the gateway's local LLM off Mac; extended to 64K ctx since that's now a hard requirement. Re-search of ngl via the optimizer planned. 2026-08-08: added --jinja (fixes a bug where, after LiteLLM's conversion, consecutive user messages in tool conversations tripped the role-alternation check and returned 500). The optimizer keeps --jinja under BOOLEAN_FLAGS -- do not remove it manually. 2026-08-30: dropped from the haiku tier. The context window rose to 102400 and this entry cannot hold it: at 96k the prefill fell from 11.48 to 6.50 tok/s and was still at 17% after 39 minutes, because a dense 24B leaves no VRAM for the KV once resident, and KV quantization is already at q4_0 with nothing left to give. Lowering -ngl 95 to 70 with --parallel 1 bought 12% (11.48 -> 12.86 tok/s at the same 7,687-token point) against the two orders of magnitude needed, so the offload direction was abandoned rather than tuned further. Left at ctx 65536 as an unrouted general entry."

Qwen3-Coder-Next-Q4_K_M:
  role: general (reasoner, dense 46B)
  used_by: []
  notes: "ctx 32768, KV cache Q4, heavy group. Dense 46B doesn't fit in 16GB VRAM, so it's slow (CPU bound)."
  decision: "2026-08: handed off the sonnet-tier role to Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL (MoE). Reason: dense 46B can't hold a 64K ctx in 16GB VRAM without slowing down, so switched to a similarly-capable MoE model that fits in VRAM."

Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL:
  role: general (former sonnet-tier and haiku-tier)
  used_by: []
  notes: "MoE 30B total / 3B active, ctx 102400, KV cache Q4 (4 KV heads x 128 head_dim x 48 layers ≈ 1.5GB @ 64K), --n-cpu-moe 20 offloads 20/48 expert layers to CPU, heavy group"
  decision: "2026-08: built the sonnet-tier fresh on this PC's llama-swap ahead of removing the local LLM on the Mac (M4 Pro). 64K ctx is a hard requirement; using the unsloth GGUF source (UD-Q4_K_XL, per-tensor dynamic quant, 17.67GB). -ngl / --n-cpu-moe are initial values pending re-search by the optimizer (--n-cpu-moe is outside the optimizer's scope, so it may need manual tuning). 2026-08-30: ctx 65536 -> 102400, and the haiku tier moved here as well. 100k measured at 1334.63 tok/s prefill and 22.71 tok/s decode (median of three n_predict-512 runs, spread under 2%), peak 14,545 of 16,303 MiB, with no flag changes needed; 128k also passes at 1080.70 tok/s and 15,289 MiB, so the window can rise again later without moving models. Haiku shares this entry because the heavy group is exclusive: a separate haiku model would evict this one on every call and reload it on the next, which makes two backends strictly worse than one. 2026-08-31: handed the haiku, sonnet and subagent routes to Qwen3.8-27B-UD-Q3_K_XL so its coding accuracy can be measured on real work rather than left unverified. Kept unrouted at ctx 102400 as the fallback that measurement returns to, since it is the one entry with real VRAM margin (1,758 MiB against 27B's 387) and the only one that also clears 128k."

Qwen3.8-27B-UD-Q3_K_XL:
  role: haiku-tier, sonnet-tier and subagent route (Claude Code LiteLLM) — coding accuracy under evaluation
  used_by:
    - cc-local-llm (LiteLLM haiku, sonnet and subagent tiers via the qwen3.8-27b route's ccgw_tiers annotation, model name Qwen3.8-27B-UD-Q3_K_XL)
  notes: "dense 27B, ctx 102400, KV cache Q4, flash-attn, heavy group. Uses native MTP (--spec-type draft-mtp --spec-draft-n-max 2, no external draft model needed); coding-only, so --no-mmproj drops the vision projector from GPU (--mmproj-auto defaults ON). Chat template is supplied externally rather than the one embedded in the GGUF (froggeric v22.4, same directory as the model)."
  decision: "2026-08: added as a coding-agent candidate for the RTX 5070 Ti 16GB. Worked around the mid-conversation system-message 500 error in Claude Code (a chat-template bug independent of quant) with an external chat template. Initially used UD-IQ4_XS (13,593 MiB), but at 64K it was short about 426 MiB of VRAM and spilled into system RAM, causing a 30% slowdown (32K 79-82 tok/s -> 64K 55.4 tok/s), so it was pinned to 32K. 2026-08-28: since 64K is now a hard requirement, replaced it with the 1,056 MiB lighter UD-Q3_K_XL (12,537 MiB). At 64K the spill dropped from 873 to 305 MiB and throughput reached 90.6 tok/s, beating even IQ4_XS's own 32K number, so IQ4_XS was retired. MTP draft acceptance rate (0.845, 125/148) matches IQ4_XS, so no draft-quality degradation was observed from the drop to 3-bit. Coding-task accuracy itself is still unverified, though. Locked because every parameter is set manually (the optimizer doesn't recognize --spec-type / --chat-template-file). 2026-08-31: took the haiku, sonnet and subagent routes from Qwen3-Coder-30B-A3B, and ctx 65536 -> 102400 with it. The point is to settle that unverified accuracy on real work: 100k measures 908.10 tok/s prefill and 51.78 decode, so against A3B it trades 1.5x the prefill for 2.3x the decode. The cost is margin -- 15,916 of 16,303 MiB leaves 387, a quarter of what A3B had, and 128k already fails here, so the context window cannot rise again while this entry is routed. Revert to A3B if accuracy does not justify that."
  optimizer: lock

