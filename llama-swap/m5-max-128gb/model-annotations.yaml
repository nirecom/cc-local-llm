# Model annotations for the config.yaml in this directory (Mac backend).
# Maintained alongside it -- see CLAUDE.md. Same format as the Windows
# host's own llama-swap annotations, minus the `optimizer:` key:
# llama-swap-optimizer tunes llama.cpp flags (-ngl, --n-cpu-moe) and has nothing
# to tune on MLX. Sizing derivations live in docs/tuning.md, not here.
#
# Every cmd below is wrapped in `caffeinate -ism` (2026-09-01): the fix for the
# 2026-07-07 sleep freeze (docs/history.md) was applied only to ds4-server at
# the time. macOS idle sleep during an active mlx_lm.server/mlx_vlm.server
# request is the same class of failure, so the wrap now applies to every
# entry, not just the one it was first caught on.

deepseek-v4-flash:
  role: fable-tier (Claude Code LiteLLM)
  used_by:
    - cc-local-llm (LiteLLM fable tier, model name deepseek-v4-flash)
  notes: "ds4-server (antirez/ds4, not MLX), ctx 393216, --quality, 32GB KV disk cache, --batched-session 2, ~90.9GB resident, checkEndpoint /v1/models"
  decision: "cmd wrapped in sh -c to pin the cwd: ds4-server resolves its model file and metal/ relative to cwd and aborts before binding under llama-swap's own cwd"

laguna-s-2.1:
  role: opus-tier candidate (Claude Code LiteLLM)
  used_by: []
  notes: "mlx_lm.server, NVFP4 4bit MLX, ~72-90GB, prompt-cache 40GB / 10 entries, concurrencyLimit 5, useModelName default_model"
  decision: "2026-08-16: prompt-cache and concurrencyLimit sizing derived in docs/tuning.md. useModelName is required because mlx_lm.server resolves any body model other than default_model as an HF repo path and 401s"

qwen3-coder-next-80b-a3b:
  role: opus-tier candidate (coding)
  used_by: []
  notes: "mlx_lm.server, MoE 80B total / 3B active, 8bit, 84.67GB weights + ~4.92GB KV at 200k ctx = ~89.6GB, prompt-cache 20GB / 5, concurrencyLimit 3"
  decision: "Hybrid attention (12 of 48 layers full-attention, the rest Gated DeltaNet with a fixed-size recurrent state) keeps KV growth far below a dense model, so 200k ctx fits under the ~116GB Metal wired ceiling"

qwen3-next-80b-a3b-thinking:
  role: opus-tier candidate (thinking)
  used_by: []
  notes: "mlx_lm.server, same base and same sizing as qwen3-coder-next-80b-a3b, Thinking variant"
  decision: "A/B alternative for when Coder-Next's lack of a thinking mode is the bottleneck. Both are mlx_lm.server/openai shape, so scripts/set-model.sh opus <key> is a same-shape swap"

qwen3.8-27b-8bit:
  role: opus-tier (Claude Code LiteLLM)
  used_by:
    - cc-local-llm (LiteLLM opus tier, model name qwen3.8-27b-8bit)
  notes: "mlx_vlm.server, dense 28B, 29.8GB, ctx 262144, --max-num-seqs 3, concurrencyLimit 3, useModelName mirrors the --model path (opposite of the mlx_lm.server convention)"
  decision: "Non-MTP side of the MTP A/B: measured 17.9 tok/s decode, 183 tok/s prefill. Kept on the same server as the MTP entry so the comparison is controlled"

qwen3.8-27b-8bit-mtp:
  role: opus-tier candidate (MTP)
  used_by: []
  notes: "qwen3.8-27b-8bit plus --draft-model Qwen3.8-27B-MTP-8bit --draft-kind mtp, 30.8GB"
  decision: "Measured 36.6 tok/s decode = 2.0x for ~1GB, 82% acceptance (36/44). Prefill is unaffected by MTP -- the target still runs one full forward pass"

qwen3.8-27b-4bit:
  role: opus-tier candidate (low memory)
  used_by: []
  notes: "4bit build of qwen3.8-27b-8bit, otherwise identical flags, ~16GB"

qwen3.8-27b-4bit-mtp:
  role: opus-tier candidate (low memory, MTP)
  used_by: []
  notes: "qwen3.8-27b-4bit plus --draft-model Qwen3.8-27B-MTP-4bit --draft-kind mtp"

qwen3.8-27b-uncensored-4bit:
  role: general (uncensored)
  used_by: []
  notes: "orcarouter abliterated fine-tune, ~15GB -- the only entry in this family not from mlx-community"
  decision: "Deliberately unpaired with MTP: the drafter was split from the stock checkpoint, and the fine-tune's weight drift would depress its acceptance rate"

qwen3.8-flash-next-mixed-3_8bit:
  role: opus-tier (long context, multimodal)
  used_by:
    - cc-local-llm (LiteLLM opus tier, model name qwen3.8-flash-next-mixed-3_8bit)
  notes: "mlx_vlm.server, MoE 125B total / 6B active plus 51B hashed n-gram PLE, self-converted mixed 3/8-bit (85GB on disk, 4.094 bpw), ctx 262144 native / 1M YaRN, --prefill-step-size 1024, --max-num-seqs 1, concurrencyLimit 1, APC off. Peaks measured on the uniform build it replaces (99.6GB at 103k ctx) shift up by the 1.8GB weight difference"
  decision: "Replaces a uniform 3bit/group-32 build that degenerated into token repetition from the first turn -- reproduced deterministically under greedy decoding on a 40-token prompt (see the retained annotation below). The recipe: routers and QSA indexer unquantized, PLE n-gram table 4bit/group-32, routed experts 3bit/group-64, everything else 8bit/group-64, following pipenetwork's published mixed-precision allocation but dropping the experts a further bit. Experts only, because the memory line in docs/tuning.md makes a gigabyte of weights cost ~6k tokens of reachable context with APC on: the 76,800-token effective auto-compact window inside a 112GB budget rules out taking that build verbatim (98.9GiB, ~16k tokens) and leaves no margin at 4-bit expert down projections (89.5GiB). --prefill-step-size 1024 halves mlx-vlm's default because QSAIndexer.from_projected's fp32 scratch -- not the KV cache -- dominates the per-token memory cost: measured 134 -> 85.5 KB per token of context, which is what puts the native 262144 ctx under the Metal working-set limit. It costs -1.1% prefill at 103k and nothing in quality. Curves and the build/context table: docs/tuning.md"

qwen3.8-flash-next-mixed-3_8bit-mtp:
  role: opus-tier candidate (long context, MTP)
  used_by: []
  notes: "qwen3.8-flash-next-mixed-3_8bit plus --draft-model Qwen3.8-Flash-Next-MTP-mixed-3_8bit --draft-kind mtp, 2.6GB drafter, plus APC_ENABLED=1 APC_EXACT_CACHE_ENTRIES=1 MLX_VLM_TOKEN_QUEUE_TIMEOUT=3600. Peaks below were measured on the uniform build's drafter (1.3GB) and shift up by the weight and drafter differences"
  decision: "The drafter was not downloaded -- convert --mtp extracted the mtp.* tensors from the source checkpoint. --max-num-seqs 1 because mlx-vlm's qwen4_exp README says the QSA cache path is not yet wired into continuous batching. The drafter costs 1.6GB against the 6.1GB --prefill-step-size 1024 frees, so the two compose: measured to 155049 ctx (105.6GB), intercept 92.4GB, 85.3 KB per token, hard ceiling ~270k. Above ~155k the binding limit is time, not memory: a 200k prompt exceeds the 600s MLX_VLM_TOKEN_QUEUE_TIMEOUT default in prefill, so the entry raises it to 3600 and 206819 tokens then complete at 288.6 tok/s, 717s, peak 109.7GB -- with APC off, since its second KV copy puts 200k at 126.5GB. Acceptance is task-dependent (87% at 36k on a realistic prompt, 97% at 103k on consecutive-name listing); plan against the former. APC is on here and nowhere else: a continuation turn over a 96140-token prompt drops from 145.1s to 1.3s, at the cost of a second copy of the KV (84 KB per token), which halves the reachable context to ~135k hard / ~115k on a 112GB budget -- a 134425-token continuation dies of Metal OOM mid-request. One entry, not two: the full-length snapshot is the one a continuation matches. Not for a routed tier until the ~115k bound is enforced upstream, because over-long prompts now fail with HTTP 500 instead of merely being slow"

qwen3.8-flash-next-3bit:
  role: retired -- uniform 3bit/group-32 build, replaced 2026-09-03
  retained: "Consulted before any future uniform low-bit conversion of a model with routers, a sparse-attention indexer, or a hashed-embedding table -- this entry is the evidence that a uniform pass is the wrong shape for one, and the reason the successor spends its bits unevenly."
  notes: "Self-converted 3bit/group-32, 83GB on disk, 4.032 bpw. Was routed to the opus tier until it was replaced by qwen3.8-flash-next-mixed-3_8bit"
  decision: "Degenerated into token repetition from the first turn of a session. Reproduced deterministically: greedy decoding on a 40-token prompt gave a type-token ratio of 0.192 with a single 5-gram repeated 10 times, where the mixed successor answered the identical prompt cleanly. It was not short of bits -- 4.032 bpw is more than the 3.705 of unsloth's UD-IQ3_XXS GGUF of the same weights, which does not repeat. It spent them uniformly, so the routers, the QSA indexer and the 160-wide PLE n-gram table ran on the same 3-bit grid as the routed experts, and their discrete selections inverted. Note also what the old text here got wrong: group-32 is not what keeps the PLE tables out of BF16. mlx_vlm's quant_utils.wrapped_predicate skips any module whose input dim the default group_size does not divide unless the predicate returns a fallback_group_size key -- an explicit group_size alone is not enough, and omitting the key silently leaves 51.2B parameters in BF16 at 7.269 bpw / 150GB with no error raised"

