# Mac-side llama-swap configuration. Manages ds4-server, Laguna S 2.1, and
# Qwen3-Coder-Next as three entries with no shared group -- llama-swap's
# default behavior already keeps exactly one model process loaded at a time,
# killing the previous one before starting the next. That default alone gives
# all three mutual exclusivity (any two together exceed the Mac's 128 GB
# unified memory), so no explicit `groups:` block is needed here.
#
# ttl: 0 disables idle-based auto-unload for both entries -- swap-on-request
# is the only unload trigger. Both backends take a long time to warm-load
# (ds4: ~90.9 GB resident; Laguna: ~72-90 GB), so an idle timeout would cause
# painful reload latency mid-session.
healthCheckTimeout: 600
logLevel: info
models:
  deepseek-v4-flash:
    # ds4-server resolves several of its inputs relative to the process cwd --
    # the default model file `ds4flash.gguf` and the Metal kernel sources under
    # `metal/` are both looked up that way. llama-swap spawns it with llama-swap's
    # own cwd (this directory), so those lookups miss and the process aborts
    # before binding its port; llama-swap then reports the failure only as
    # "upstream command exited prematurely". Pinning the cwd via `sh -c` fixes
    # the whole class at once, rather than absolutizing each path one at a time.
    cmd: >-
      sh -c 'cd "$HOME/git/ds4" && exec
      caffeinate -ism ./ds4-server
      --port ${PORT} --host 127.0.0.1
      --metal --quality --ctx 393216
      --kv-disk-dir ${env.HOME}/Library/Caches/ds4-server/kv
      --kv-disk-space-mb 32768
      --kv-cache-cold-max-tokens 90000
      --kv-cache-continued-interval-tokens 50000
      --warm-weights --batched-session 2'
    proxy: http://127.0.0.1:${PORT}
    # ds4-server serves no /health route (404), so llama-swap's default health
    # check never passes and the load fails at healthCheckTimeout even though the
    # process is up and listening. /v1/models is the cheapest route it does
    # answer. Not needed on laguna-s-2.1: mlx_lm.server implements /health.
    checkEndpoint: /v1/models
    ttl: 0
  laguna-s-2.1:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/poolside/Laguna-S-2.1-NVFP4-mlx
      --prompt-cache-bytes 40GB
      --prompt-cache-size 10
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    # mlx_lm.server resolves any body `model` other than `default_model` as a
    # HF repo path and 401s. Routing key stays laguna-s-2.1 for LiteLLM; only
    # the upstream body is rewritten. Not needed on ds4 (accepts any name).
    useModelName: default_model
    # --prompt-cache-bytes/-size and concurrencyLimit: sizing rationale, KV-cost
    # derivation from Laguna's architecture, and memory-budget math are in
    # docs/tuning.md ("Server flags (Laguna S 2.1)") and docs/history.md
    # (CONFIG, 2026-08-16). Keep this file to values only -- don't re-derive here.
    concurrencyLimit: 5
  qwen3-coder-next-80b-a3b:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3-Coder-Next-8bit
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    # Same mlx_lm.server default-model-routing quirk as laguna-s-2.1 -- see
    # that entry's comment.
    useModelName: default_model
    # Sizing: weights 84.67GB + 200k-ctx active KV ~4.92GB ~= 89.6GB resident,
    # leaving ~26.4GB headroom to the ~116GB Metal wired ceiling. Hybrid
    # attention (12/48 full-attention layers, rest Gated DeltaNet with a
    # fixed-size recurrent state) keeps KV growth far below a dense-attention
    # model at the same context length. prompt-cache-bytes/concurrencyLimit
    # are conservative first-pass values pending real-world tuning -- see
    # docs/tuning.md before adjusting.
    concurrencyLimit: 3
  # Qwen3.8-27B family -- dense 28B, not the 80B-A3B family above, so weights
  # (~29.5GB at 8bit, ~16GB at 4bit) leave far more headroom than
  # qwen3-coder-next-80b-a3b/qwen3-next-80b-a3b-thinking. The
  # prompt-cache/concurrencyLimit values below are copied from those two as a
  # conservative starting point and are not tuned for this smaller footprint
  # -- see docs/tuning.md before adjusting.
  #
  # The -mtp variants pair a target with its matching MTP speculative-decoding
  # drafter. The adapter carries drafter weights only -- no token embeddings
  # and no LM head, which it borrows from the target at runtime -- so it never
  # runs standalone, and mlx-community publishes one adapter per quantization
  # (4bit/8bit/bf16/mxfp4) precisely because adapter and target are expected to
  # match. Every checkpoint here is therefore kept on the mlx-community
  # conversion of Qwen/Qwen3.8-27B so target and adapter share one lineage.
  # Flags are --draft-model/--num-draft-tokens, confirmed against
  # `mlx_lm.server --help` -- not the --draft-model-path some web docs claim.
  qwen3.8-27b-8bit:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-8bit
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    # Same mlx_lm.server default-model-routing quirk as laguna-s-2.1 -- see
    # that entry's comment. Applies to every entry in this family.
    useModelName: default_model
    concurrencyLimit: 3
  qwen3.8-27b-8bit-mtp:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-8bit
      --draft-model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-MTP-8bit
      --num-draft-tokens 3
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    useModelName: default_model
    concurrencyLimit: 3
  qwen3.8-27b-4bit:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-4bit
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    useModelName: default_model
    concurrencyLimit: 3
  qwen3.8-27b-4bit-mtp:
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-4bit
      --draft-model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3.8-27B-MTP-4bit
      --num-draft-tokens 3
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    useModelName: default_model
    concurrencyLimit: 3
  qwen3.8-27b-uncensored-4bit:
    # Third-party abliterated fine-tune (orcarouter), ~15GB -- the one entry in
    # this family that is not an mlx-community conversion of the stock
    # checkpoint. Its weights genuinely differ from the base model, so no MTP
    # adapter is paired with it: the drafter was split from stock Qwen3.8-27B
    # and the fine-tune's weight drift would depress its acceptance rate.
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/orcarouter/Qwen3.8-27B-Uncensored-MLX
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    useModelName: default_model
    concurrencyLimit: 3
  qwen3-next-80b-a3b-thinking:
    # Same Qwen3-Next-80B-A3B base architecture as qwen3-coder-next-80b-a3b
    # above (hybrid Gated DeltaNet/Gated Attention, 80B/3B, 84.7GB in 8bit),
    # but the Thinking variant instead of Coder -- an A/B alternative for the
    # opus tier when Coder-Next's lack of a thinking mode is the bottleneck.
    # Switch between the two with `scripts/set-model.sh opus <key>` -- both are
    # mlx_lm.server/openai-shape, so it's a same-shape swap needing no manual
    # litellm-server/config.yaml edit.
    cmd: >-
      mlx_lm.server --host 127.0.0.1 --port ${PORT}
      --model ${env.HOME}/.lmstudio/models/mlx-community/Qwen3-Next-80B-A3B-Thinking-8bit
      --prompt-cache-bytes 20GB
      --prompt-cache-size 5
    proxy: http://127.0.0.1:${PORT}
    ttl: 0
    # Same mlx_lm.server default-model-routing quirk as laguna-s-2.1 -- see
    # that entry's comment.
    useModelName: default_model
    # Sizing mirrors qwen3-coder-next-80b-a3b (identical weight size, same
    # hybrid-attention KV profile) -- see that entry's comment and
    # docs/tuning.md before adjusting.
    concurrencyLimit: 3
