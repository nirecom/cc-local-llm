# LiteLLM proxy configuration for ccgw (Claude Code GateWay, client side).
# Routes Claude Code model tiers to different backends by model name.
# Env vars are resolved at startup via os.environ/ pattern (NOT ${VAR:default}).
# All defaults are documented in .env.example, not embedded here.
#
# IMPORTANT: The os.environ/ prefix is only resolved by LiteLLM when it appears
# at the START of a value. After a provider prefix (e.g., openai/), the entire
# string including os.environ/ is passed literally to the backend. Therefore,
# model_name (routing key) uses os.environ/, but litellm_params.model uses a
# hardcoded backend model name after the provider prefix.

model_list:
  # --- Haiku tier: Devstral-Small-2-24B via llama-swap @ this PC (primary) ---
  - model_name: os.environ/LITELLM_HAIKU_MODEL
    litellm_params:
      model: openai/Devstral-Small-2-24B-Instruct-2512-IQ4_XS
      api_base: os.environ/LITELLM_LLAMASWAP_URL
      api_key: none
      stream: true
      max_tokens: 8192
      context_window: 65536
      timeout: 60

  # --- Sonnet tier: Qwen3-Coder-30B-A3B-Instruct via llama-swap @ this PC (primary) ---
  - model_name: os.environ/LITELLM_SONNET_MODEL
    litellm_params:
      model: openai/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL
      api_base: os.environ/LITELLM_LLAMASWAP_URL
      api_key: none
      stream: true
      max_tokens: 8192
      context_window: 65536
      timeout: 60

  # --- Opus tier: DeepSeek V4 Flash via DS4 Proxy -> Mac llama-swap ---
  - model_name: os.environ/LITELLM_OPUS_MODEL
    litellm_params:
      model: anthropic/deepseek-v4-flash
      api_base: os.environ/LITELLM_OPUS_URL
      api_key: os.environ/LITELLM_OPUS_API_KEY
      stream: true
      max_tokens: 8192
      context_window: 393216

  # --- Laguna tier: Laguna S 2.1 via DS4 Proxy -> Mac llama-swap ---
  # Exclusive with the Opus/ds4 tier on the Mac side (see llama-swap/config.yaml in
  # this repo) -- both cannot be resident at once, select with /model.
  - model_name: os.environ/LITELLM_LAGUNA_MODEL
    litellm_params:
      model: anthropic/laguna-s-2.1
      api_base: os.environ/LITELLM_OPUS_URL
      api_key: os.environ/LITELLM_OPUS_API_KEY
      stream: true
      max_tokens: 8192
      context_window: 262144

litellm_settings:
  drop_params: false
  enable_caching_on_failures: false
  store_model_options_in_db: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: simple-shuffle
  # No fallback for Haiku/Sonnet tiers: this PC (llama-swap) is the sole backend.
  # M4 Pro fallback was removed (2026-08) — its failure modes were not worth the
  # diagnostic overhead. A request fails outright if this PC is offline.
  num_retries: 0
  enable_pre_call_routing: false
